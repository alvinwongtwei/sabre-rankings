name: Daily rankings update

on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC = 06:30 Singapore time, every day
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Fetch rankings
        run: python scrape.py

      - name: Save data.json to the repo (git history = your archive)
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update rankings $(date -u +%F)" && git push)

      - name: Build site folder
        run: mkdir site && cp index.html data.json site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
